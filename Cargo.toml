[workspace]
resolver = "2"
members = ["crates/bite-bridge", "crates/bite-core", "crates/bite-mcp"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/ktesio/bite-mcp"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true
