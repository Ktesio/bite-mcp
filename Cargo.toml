[workspace]
resolver = "2"
members = ["crates/bite-bridge", "crates/bite-core", "crates/bite-index", "crates/bite-mcp"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ktesio/bite-mcp"
# MSRV floor is enforced by the dependency graph, not our own syntax:
# lancedb 0.39 / lance 12 declare rust-version = 1.91.0 (edition 2024),
# datafusion 54 declares 1.88, and the committed Cargo.lock is format v4
# (unreadable by cargo < 1.78). Proven by the `msrv` CI lane; keep all four
# in lockstep when any of them moves.
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true
