[package]
name = "bite-index"
description = "Global entity index (LanceDB) for bite: ingest, FTS+scalar search, counts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Default features only — nothing here talks to a remote LanceDB service.
# The `remote` feature existed solely as a compile workaround: 0.39–0.40
# referenced the remote-gated Error::Http unconditionally in job.rs; 0.41
# cfg-gates that path (lancedb/lancedb#4142), so the feature now only pulls
# an unused arrow-flight/reqwest/tonic client stack into the tree.
# Arrow types come from the `lancedb::arrow` re-export — never declare direct
# arrow-array/arrow-schema deps here; a mismatched direct version splits the
# crate graph and the store stops compiling (lancedb/lancedb#3575).
lancedb = "0.41"
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
bite-core = { path = "../bite-core", version = "0.5.0" }

[dev-dependencies]
# self-cleaning test/bench scratch dirs (Drop guard — panics can't leak them)
tempfile = "3"
