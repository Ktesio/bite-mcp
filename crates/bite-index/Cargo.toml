[package]
name = "bite-index"
description = "Global entity index (LanceDB) for bite: ingest, FTS+scalar search, counts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `remote` required: upstream (0.39–0.40) references the remote-gated
# Error::Http unconditionally in job.rs, so default-feature builds fail to
# compile
# Arrow types come from the `lancedb::arrow` re-export — never declare direct
# arrow-array/arrow-schema deps here; a mismatched direct version splits the
# crate graph and the store stops compiling (lancedb/lancedb#3575).
lancedb = { version = "0.40", features = ["remote"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
bite-core = { path = "../bite-core", version = "0.4.0" }

[dev-dependencies]
# self-cleaning test/bench scratch dirs (Drop guard — panics can't leak them)
tempfile = "3"
