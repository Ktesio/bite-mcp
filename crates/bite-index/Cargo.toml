[package]
name = "bite-index"
description = "Global entity index (LanceDB) for bite: ingest, FTS+scalar search, counts"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `remote` required: upstream 0.39.0 references the remote-gated Error::Http
# unconditionally in job.rs, so default-feature builds fail to compile
# arrow-array/arrow-schema MUST stay on the same major as the arrow stack
# lancedb builds against (see the `lance` entry in Cargo.lock). lancedb 0.40
# uses arrow 58; bumping these ahead of lancedb reintroduces arrow-skew
# trait-bound errors in this crate.
lancedb = { version = "0.40", features = ["remote"] }
arrow-array = "58"
arrow-schema = "58"
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
bite-core = { path = "../bite-core", version = "0.3.0" }

[dev-dependencies]
# self-cleaning test/bench scratch dirs (Drop guard — panics can't leak them)
tempfile = "3"
