# Dependency updates for Ktesio/bite-mcp.
#
# Batches kept small and weekly so routine bumps arrive as a handful of
# reviewable PRs instead of a daily flood. Cargo PRs run the full CI matrix
# (fmt/clippy/tests on macOS runners); the committed Cargo.lock pins the
# resolution so every PR diff is reproducible from the lockfile.
#
# Note on SHA-pinned actions: the workflows pin third-party actions to commit
# SHAs with version comments (see ci.yml / release.yml). Dependabot's
# github-actions updater understands that format and rewrites the SHA while
# updating the comment, so pins stay both immutable and current.
version: 2

updates:
  # Rust workspace dependencies (Cargo.lock).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      # The Lance / Arrow stack moves lockstep, in its own PR: lancedb pins
      # the arrow major its lance build targets, and crates/bite-index also
      # depends on arrow-array/arrow-schema directly. Bumping the direct
      # arrow requirements ahead of lancedb once left two arrow majors in
      # one dependency graph and broke bite-index with arrow-skew trait
      # bound errors, so every update for this stack — patch, minor or
      # major — is batched into a single dedicated PR that gets full review
      # against the matrix + msrv lanes. A lone arrow major in that PR
      # means the direct pins must be held back; see the lockstep comment
      # in crates/bite-index/Cargo.toml.
      lance-arrow-stack:
        applies-to: "version-updates"
        patterns:
          - "lance*"
          - "arrow*"
      # Lockfile-only bumps (semver-compatible cargo updates) are batched:
      # they are low-risk and noisy one-by-one. The Lance / Arrow stack is
      # excluded here — it owns the group above.
      cargo-lockfile-only:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "lance*"
          - "arrow*"
      # Unrelated major bumps get their own dedicated PR — majors have
      # broken CI before and deserve full review against the matrix + msrv
      # lanes. The Lance / Arrow stack is excluded so unrelated majors can
      # never drag the arrow pins ahead of lancedb again.
      cargo-major-updates:
        applies-to: "version-updates"
        update-types:
          - "major"
        exclude-patterns:
          - "lance*"
          - "arrow*"
      # Security fixes ride together in one PR so they can be reviewed and
      # merged fast; an advisory against the arrow stack is coordinated
      # upstream across crates, so urgency beats lockstep grouping here.
      cargo-security-updates:
        applies-to: "security-updates"
        update-types:
          - "patch"
          - "minor"
          - "major"

  # GitHub Actions workflow dependencies (SHA pins in ci.yml / release.yml).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    groups:
      actions-patch-and-minor:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
      actions-major-updates:
        applies-to: "version-updates"
        update-types:
          - "major"
      actions-security-updates:
        applies-to: "security-updates"
        update-types:
          - "patch"
          - "minor"
          - "major"
