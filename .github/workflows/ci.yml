name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job in this workflow writes to the repo (checkout,
# builds and checks only), so the default token scope is narrowed to read.
# Mirrors the explicit block in release.yml (which grants contents: write
# because it publishes a GitHub Release).
permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-14
    steps:
      # Third-party actions are pinned to full commit SHAs (immutable) rather
      # than mutable tags: a hijacked tag would otherwise run attacker code in
      # this workflow with access to the cache and (on main) repo secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc (required by the Lance stack)
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Swift tests (helper logic)
        run: swift test --package-path crates/bite-mcp/swift

      - name: Rust tests (builds Swift helper via build.rs)
        run: cargo test --workspace

  audit:
    # Supply-chain lane: scan the committed Cargo.lock for RustSec advisories
    # so a vulnerable transitive dependency is caught by CI before it ships.
    # cargo-deny layers the deny.toml policies on top: license allow-list,
    # wildcard-version bans (duplicate majors warn) and a crates.io-only
    # source policy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo +stable install cargo-deny --locked

      - name: Scan the lockfile (RustSec advisories)
        run: cargo +stable audit

      - name: Check licenses, dependency bans and sources (cargo-deny)
        run: cargo +stable deny --workspace check bans licenses sources

  changelog:
    # Changelog conformance fence: CHANGELOG.md section shape, heading form
    # and the [Unreleased]-vs-released reference rule, so release prep
    # cannot leave shipped entries behind (the v0.5.0 tag shipped while its
    # entries still sat under [Unreleased]).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CHANGELOG.md conventions
        run: python3 scripts/check_changelog.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc (required by the Lance stack)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # 1.91.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check workspace builds on the MSRV
        # Floor set by the dependency graph: lancedb 0.39 / lance 12 declare
        # rust-version = 1.91.0 (edition 2024); datafusion 54 declares 1.88.
        # --all-targets so dev-dependencies compile on the floor too. Keep in
        # lockstep with rust-version in the root Cargo.toml.
        run: cargo check --workspace --all-targets

  mcp-inspector:
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc (required by the Lance stack)
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build bite
        run: cargo build --workspace

      - name: Install MCP Inspector and smoke-run the server
        run: |
          set -e
          # Pin an exact version: an unpinned install (and the npx registry
          # fallback it used to rely on) resolves whatever is `latest` at run
          # time, so a compromised or breaking release enters CI unreviewed.
          # Bump deliberately; the installed binary `mcp-inspector` is on PATH.
          npm install -g @modelcontextprotocol/inspector@2.11.0
          mcp-inspector --cli ./target/debug/bite mcp --method tools/list | tee tools.json
          python3 - <<'EOF'
          import json, sys
          data = json.load(open('tools.json'))
          names = [t['name'] for t in data['tools']]
          assert len(names) >= 38, f"expected >= 38 tools, got {len(names)}"
          for required in ("calendar_event_create", "mail_send", "reminders_search", "messages_history"):
              assert required in names, f"missing {required}"
          print(f"MCP inspector: {len(names)} tools OK")
          EOF
