# Source-only release: build + test + publish to crates.io + release notes.
#
# Deliberately NO prebuilt/notarized binaries: the supported install paths are
# `cargo install bite-mcp` and the Claude/ZCode marketplace, both of which
# compile locally and need no Apple signing. If prebuilt downloads are ever
# wanted, re-add Developer-ID signing + notarization here (requires a paid
# Apple Developer Program) — see docs/ROADMAP.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and test
        run: |
          cargo build --release --workspace
          cargo test --workspace --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p bite-bridge
          sleep 20
          cargo publish -p bite-core
          sleep 20
          cargo publish -p bite-mcp
