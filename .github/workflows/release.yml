# Source-only release: build + test + publish to crates.io + release notes.
#
# Deliberately NO prebuilt/notarized binaries: the supported install paths are
# `cargo install bite-mcp` and the Claude/ZCode marketplace, both of which
# compile locally and need no Apple signing. If prebuilt downloads are ever
# wanted, re-add Developer-ID signing + notarization here (requires a paid
# Apple Developer Program) — see docs/ROADMAP.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      # Third-party actions are pinned to full commit SHAs (immutable) rather
      # than mutable tags: a hijacked tag would otherwise run attacker code in
      # this workflow with access to the release and crates.io secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install protoc (required by the Lance stack)
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build and test
        run: |
          cargo build --release --workspace
          cargo test --workspace --release

      - name: Changelog entry guard
        # A tag may only ship when CHANGELOG.md carries a matching
        # `## [vX.Y.Z]` section (see the convention at the top of the file).
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^## \[?v?${tag//./\\.}\]?" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [v${tag}]' section for tag ${GITHUB_REF_NAME}." >&2
            echo "Add the section (and move [Unreleased] items under it) before pushing the tag." >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # deps must be live on crates.io before dependents resolve, so publish
        # in dependency order with a retry against index-propagation lag.
        # "already exists" (re-run after partial failure) counts as success.
        run: |
          set -e
          publish_one() {
            local pkg=$1
            for attempt in 1 2 3; do
              local out
              if out=$(cargo publish -p "$pkg" 2>&1); then
                echo "published $pkg"; return 0
              fi
              if echo "$out" | grep -q "already exists"; then
                echo "$pkg already published; skipping"; return 0
              fi
              echo "publish $pkg attempt $attempt failed:"
              echo "$out" | tail -5
              sleep 30
            done
            echo "publishing $pkg failed after 3 attempts"; return 1
          }
          publish_one bite-bridge
          publish_one bite-index
          publish_one bite-core
          sleep 20
          publish_one bite-mcp
