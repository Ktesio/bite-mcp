# Source-only release: build + test + publish to crates.io + release notes.
#
# Deliberately NO prebuilt/notarized binaries: the supported install paths are
# `cargo install bite-mcp` and the Claude/ZCode marketplace, both of which
# compile locally and need no Apple signing. If prebuilt downloads are ever
# wanted, re-add Developer-ID signing + notarization here (requires a paid
# Apple Developer Program) — see docs/ROADMAP.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (required by the Lance stack)
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and test
        run: |
          cargo build --release --workspace
          cargo test --workspace --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # deps must be live on crates.io before dependents resolve, so publish
        # in dependency order with a retry against index-propagation lag.
        # "already exists" (re-run after partial failure) counts as success.
        run: |
          set -e
          publish_one() {
            local pkg=$1
            for attempt in 1 2 3; do
              local out
              if out=$(cargo publish -p "$pkg" 2>&1); then
                echo "published $pkg"; return 0
              fi
              if echo "$out" | grep -q "already exists"; then
                echo "$pkg already published; skipping"; return 0
              fi
              echo "publish $pkg attempt $attempt failed:"
              echo "$out" | tail -5
              sleep 30
            done
            echo "publishing $pkg failed after 3 attempts"; return 1
          }
          publish_one bite-bridge
          publish_one bite-index
          publish_one bite-core
          sleep 20
          publish_one bite-mcp
