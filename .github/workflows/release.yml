# Source-only release: build + test + publish to crates.io + release notes.
#
# Deliberately NO prebuilt/notarized binaries: the supported install paths are
# `cargo install bite-mcp` and the Claude/ZCode marketplace, both of which
# compile locally and need no Apple signing. If prebuilt downloads are ever
# wanted, re-add Developer-ID signing + notarization here (requires a paid
# Apple Developer Program) — see docs/ROADMAP.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and test
        run: |
          cargo build --release --workspace
          cargo test --workspace --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # deps must be live on crates.io before dependents resolve, so publish
        # in dependency order with a retry against index-propagation lag
        run: |
          set -e
          for pkg in bite-bridge bite-core bite-mcp; do
            ok=""
            for attempt in 1 2 3; do
              if cargo publish -p "$pkg"; then ok=1; break; fi
              echo "publish $pkg attempt $attempt failed; retrying in 30s"
              sleep 30
            done
            [ -n "$ok" ] || { echo "publishing $pkg failed after 3 attempts"; exit 1; }
          done
